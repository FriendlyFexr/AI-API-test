<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Model Comparison Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f0f6fc;
            text-align: center;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Controls Layout */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #238636;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .mode-label {
            font-weight: 600;
            color: #58a6ff;
        }

        .input-group {
            display: flex;
            flex: 1;
            gap: 10px;
            min-width: 300px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        .btn-green {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-green:hover { background-color: #2ea043; }
        .btn-green:disabled { background-color: #23863680; cursor: not-allowed; }

        /* Side-by-Side Comparison Grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        .provider-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .output-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .output-title {
            background-color: #21262d;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: #30363d;
            color: #8b949e;
        }

        .output-content {
            padding: 15px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1117;
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
        }

        .output-content p {
            margin: 0;
            text-align: left;
            color: #c9d1d9;
            white-space: pre-wrap;
            width: 100%;
        }

        video {
            width: 100%;
            max-height: 240px;
            border-radius: 6px;
            outline: none;
        }

        /* Debug Console */
        .debug-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .debug-header h2 {
            font-size: 1rem;
            margin: 0;
            color: #8b949e;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #58a6ff;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .clear-btn:hover { text-decoration: underline; }

        #debug-log {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            white-space: pre-wrap;
        }

        .log-entry { margin-bottom: 4px; }
        .log-info { color: #58a6ff; }
        .log-success { color: #7ee787; }
        .log-error { color: #f85149; }
    </style>
</head>
<body>

    <h1>Gemini vs OpenAI Comparison Dashboard</h1>

    <div class="container">
        <div class="controls-bar">
            <!-- Mode Selector -->
            <div class="toggle-group">
                <span>Text Mode</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider"></span>
                </label>
                <span>Video Mode</span>
            </div>

            <!-- Input Form -->
            <div class="input-group">
                <input type="text" id="prompt-input" placeholder="Enter prompt to test both models..." />
                <button class="btn-green" id="submit-btn" onclick="sendRequest()">Generate Both</button>
            </div>
        </div>
    </div>

    <!-- Side-by-Side Comparison Layout -->
    <div class="comparison-grid">
        
        <!-- Google Gemini Column -->
        <div class="provider-column">
            <div class="output-box">
                <div class="output-title">
                    <span>Google Gemini API</span>
                    <span class="badge" id="gemini-status">Idle</span>
                </div>
                <div class="output-content" id="gemini-output">
                    <span>Awaiting prompt submission...</span>
                </div>
            </div>
        </div>

        <!-- OpenAI Column -->
        <div class="provider-column">
            <div class="output-box">
                <div class="output-title">
                    <span>OpenAI API</span>
                    <span class="badge" id="openai-status">Idle</span>
                </div>
                <div class="output-content" id="openai-output">
                    <span>Awaiting prompt submission...</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Debug Log Section -->
    <div class="debug-container">
        <div class="debug-header">
            <h2>Debug Log</h2>
            <button class="clear-btn" onclick="clearLogs()">Clear Log</button>
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        const toggle = document.getElementById('mode-toggle');
        const promptInput = document.getElementById('prompt-input');
        const debugLog = document.getElementById('debug-log');
        const submitBtn = document.getElementById('submit-btn');

        const geminiOutput = document.getElementById('gemini-output');
        const openaiOutput = document.getElementById('openai-output');
        const geminiStatus = document.getElementById('gemini-status');
        const openaiStatus = document.getElementById('openai-status');

        log('Dashboard initialized. Enter a prompt to compare Gemini and OpenAI.', 'info');

        toggle.addEventListener('change', () => {
            const mode = toggle.checked ? 'Video Generation' : 'Text Generation';
            log(`Generation mode switched to: ${mode}`, 'info');
        });

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function clearLogs() {
            debugLog.innerHTML = '';
            log('Logs cleared.', 'info');
        }

        async function sendRequest() {
            const prompt = promptInput.value.trim();
            const isVideo = toggle.checked;
            const mode = isVideo ? 'video' : 'text';

            if (!prompt) {
                log('Error: Prompt field is empty.', 'error');
                return;
            }

            submitBtn.disabled = true;
            log(`Initiating parallel ${mode.toUpperCase()} requests...`, 'info');
            log(`Prompt: "${prompt}"`, 'info');

            // Reset UI States
            geminiStatus.textContent = 'Processing...';
            openaiStatus.textContent = 'Processing...';
            geminiOutput.innerHTML = `<span>Generating ${mode} via Gemini...</span>`;
            openaiOutput.innerHTML = `<span>Generating ${mode} via OpenAI...</span>`;

            // Run requests concurrently
            Promise.all([
                fetchGeminiOutput(prompt, isVideo),
                fetchOpenAIOutput(prompt, isVideo)
            ]).finally(() => {
                submitBtn.disabled = false;
            });
        }

        // Simulates Gemini API fetch
        async function fetchGeminiOutput(prompt, isVideo) {
            try {
                log('[Gemini API] Request dispatched...', 'info');
                await new Promise(r => setTimeout(r, isVideo ? 2500 : 1200));

                if (isVideo) {
                    geminiOutput.innerHTML = `
                        <video controls autoplay loop muted>
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        </video>`;
                    log('[Gemini API] Video rendering complete.', 'success');
                } else {
                    geminiOutput.innerHTML = `<p><strong>[Gemini Response]:</strong>\nHere is the generated output from Google Gemini for prompt: "${prompt}"</p>`;
                    log('[Gemini API] Text response received.', 'success');
                }
                geminiStatus.textContent = 'Complete';
            } catch (err) {
                log(`[Gemini API] Error: ${err.message}`, 'error');
                geminiStatus.textContent = 'Failed';
            }
        }

        // Simulates OpenAI API fetch
        async function fetchOpenAIOutput(prompt, isVideo) {
            try {
                log('[OpenAI API] Request dispatched...', 'info');
                await new Promise(r => setTimeout(r, isVideo ? 3500 : 1800));

                if (isVideo) {
                    openaiOutput.innerHTML = `
                        <video controls autoplay loop muted>
                            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
                        </video>`;
                    log('[OpenAI API] Sora/Video rendering complete.', 'success');
                } else {
                    openaiOutput.innerHTML = `<p><strong>[OpenAI Response]:</strong>\nHere is the generated output from OpenAI GPT for prompt: "${prompt}"</p>`;
                    log('[OpenAI API] Text response received.', 'success');
                }
                openaiStatus.textContent = 'Complete';
            } catch (err) {
                log(`[OpenAI API] Error: ${err.message}`, 'error');
                openaiStatus.textContent = 'Failed';
            }
        }
    </script>
</body>
</html>
