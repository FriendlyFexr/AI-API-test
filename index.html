<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Comparison Dashboard (Gemini & Groq)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f0f6fc;
            text-align: center;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* API Keys Configuration Grid */
        .api-keys-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        @media (max-width: 600px) {
            .api-keys-grid {
                grid-template-columns: 1fr;
            }
        }

        .key-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .key-input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8b949e;
        }

        /* Input Controls */
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        /* Controls Layout */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #238636;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .input-group {
            display: flex;
            flex: 1;
            gap: 10px;
            min-width: 300px;
        }

        .btn-green {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-green:hover { background-color: #2ea043; }
        .btn-green:disabled { background-color: #23863680; cursor: not-allowed; }

        /* Side-by-Side Grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        .provider-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .output-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .output-title {
            background-color: #21262d;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: #30363d;
            color: #8b949e;
        }

        .output-content {
            padding: 15px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1117;
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
        }

        .output-content p {
            margin: 0;
            text-align: left;
            color: #c9d1d9;
            white-space: pre-wrap;
            width: 100%;
        }

        video {
            width: 100%;
            max-height: 240px;
            border-radius: 6px;
            outline: none;
        }

        /* Debug Console */
        .debug-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .debug-header h2 {
            font-size: 1rem;
            margin: 0;
            color: #8b949e;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #58a6ff;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .clear-btn:hover { text-decoration: underline; }

        #debug-log {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            white-space: pre-wrap;
        }

        .log-entry { margin-bottom: 4px; }
        .log-info { color: #58a6ff; }
        .log-success { color: #7ee787; }
        .log-error { color: #f85149; }
    </style>
</head>
<body>

    <h1>Gemini vs Groq Dashboard</h1>

    <div class="container">
        <!-- API Keys Configuration Section -->
        <div class="api-keys-grid">
            <div class="key-input-group">
                <label for="gemini-key">Google Gemini API Key</label>
                <input type="password" id="gemini-key" placeholder="Paste Gemini API Key here..." autocomplete="off" />
            </div>
            <div class="key-input-group">
                <label for="groq-key">Groq API Key</label>
                <input type="password" id="groq-key" placeholder="Paste Groq API Key here..." autocomplete="off" />
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-bar">
            <div class="toggle-group">
                <span>Text Mode</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider"></span>
                </label>
                <span>Video Mode</span>
            </div>

            <div class="input-group">
                <input type="text" id="prompt-input" placeholder="Enter prompt to test models..." />
                <button class="btn-green" id="submit-btn" onclick="sendRequest()">Generate Both</button>
            </div>
        </div>
    </div>

    <!-- Side-by-Side Comparison Output -->
    <div class="comparison-grid">
        
        <!-- Google Gemini Column -->
        <div class="provider-column">
            <div class="output-box">
                <div class="output-title">
                    <span>Google Gemini API</span>
                    <span class="badge" id="gemini-status">Idle</span>
                </div>
                <div class="output-content" id="gemini-output">
                    <span>Awaiting prompt submission...</span>
                </div>
            </div>
        </div>

        <!-- Groq Column -->
        <div class="provider-column">
            <div class="output-box">
                <div class="output-title">
                    <span>Groq API</span>
                    <span class="badge" id="groq-status">Idle</span>
                </div>
                <div class="output-content" id="groq-output">
                    <span>Awaiting prompt submission...</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Debug Log Panel -->
    <div class="debug-container">
        <div class="debug-header">
            <h2>Debug Log</h2>
            <button class="clear-btn" onclick="clearLogs()">Clear Log</button>
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        const toggle = document.getElementById('mode-toggle');
        const promptInput = document.getElementById('prompt-input');
        const debugLog = document.getElementById('debug-log');
        const submitBtn = document.getElementById('submit-btn');

        const geminiKeyInput = document.getElementById('gemini-key');
        const groqKeyInput = document.getElementById('groq-key');

        const geminiOutput = document.getElementById('gemini-output');
        const groqOutput = document.getElementById('groq-output');
        const geminiStatus = document.getElementById('gemini-status');
        const groqStatus = document.getElementById('groq-status');

        log('Dashboard initialized. Enter API keys above and enter a prompt.', 'info');

        toggle.addEventListener('change', () => {
            const mode = toggle.checked ? 'Video Generation' : 'Text Generation';
            log(`Generation mode switched to: ${mode}`, 'info');
        });

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function clearLogs() {
            debugLog.innerHTML = '';
            log('Logs cleared.', 'info');
        }

        async function sendRequest() {
            const prompt = promptInput.value.trim();
            const isVideo = toggle.checked;
            const geminiKey = geminiKeyInput.value.trim();
            const groqKey = groqKeyInput.value.trim();

            if (!prompt) {
                log('Error: Prompt field is empty.', 'error');
                return;
            }

            if (!geminiKey && !groqKey) {
                log('Error: Please enter at least one API key to perform requests.', 'error');
                return;
            }

            submitBtn.disabled = true;
            log(`Initiating requests (${isVideo ? 'VIDEO' : 'TEXT'} mode)...`, 'info');

            const requests = [];

            if (geminiKey) {
                geminiStatus.textContent = 'Processing...';
                geminiOutput.innerHTML = `<span>Generating ${isVideo ? 'video' : 'text'} via Gemini...</span>`;
                requests.push(fetchGemini(prompt, isVideo, geminiKey));
            } else {
                log('Skipping Gemini: No API key provided.', 'info');
                geminiStatus.textContent = 'Skipped';
            }

            if (groqKey) {
                groqStatus.textContent = 'Processing...';
                groqOutput.innerHTML = `<span>Generating ${isVideo ? 'video' : 'text'} via Groq...</span>`;
                requests.push(fetchGroq(prompt, isVideo, groqKey));
            } else {
                log('Skipping Groq: No API key provided.', 'info');
                groqStatus.textContent = 'Skipped';
            }

            Promise.all(requests).finally(() => {
                submitBtn.disabled = false;
            });
        }

        // ----------------------------------------------------
        // GOOGLE GEMINI API FETCH
        // ----------------------------------------------------
        async function fetchGemini(prompt, isVideo, apiKey) {
            try {
                log('[Gemini API] Request sent...', 'info');

                if (!isVideo) {
                    // Updated model endpoint to gemini-2.5-flash
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const resultText = data.candidates[0].content.parts[0].text;
                    geminiOutput.innerHTML = `<p>${resultText}</p>`;
                    log('[Gemini API] Text generated successfully.', 'success');
                    geminiStatus.textContent = 'Complete';
                } else {
                    log('[Gemini API] Submitting Video Generation task...', 'info');
                    const startUrl = `https://generativelanguage.googleapis.com/v1beta/models/veo-2.0-generate-001:predictLongRunning?key=${apiKey}`;
                    
                    const response = await fetch(startUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: { text: prompt }
                        })
                    });

                    const job = await response.json();
                    if (job.error) throw new Error(job.error.message);

                    log(`[Gemini API] Video task started. Operation: ${job.name}`, 'info');
                    await pollVideoJob(job.name, apiKey, geminiOutput, geminiStatus, 'Gemini');
                }
            } catch (err) {
                log(`[Gemini API] Error: ${err.message}`, 'error');
                geminiOutput.innerHTML = `<span style="color:#f85149;">Error: ${err.message}</span>`;
                geminiStatus.textContent = 'Failed';
            }
        }

        // ----------------------------------------------------
        // GROQ API FETCH
        // ----------------------------------------------------
        async function fetchGroq(prompt, isVideo, apiKey) {
            try {
                log('[Groq API] Request sent...', 'info');

                if (!isVideo) {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'llama-3.3-70b-versatile',
                            messages: [{ role: 'user', content: prompt }]
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const resultText = data.choices[0].message.content;
                    groqOutput.innerHTML = `<p>${resultText}</p>`;
                    log('[Groq API] Text generated successfully.', 'success');
                    groqStatus.textContent = 'Complete';
                } else {
                    log('[Groq API] Video mode selected. Groq currently only supports text models.', 'error');
                    groqOutput.innerHTML = `<span style="color:#f85149;">Groq does not support video generation models. Switch to Text Mode.</span>`;
                    groqStatus.textContent = 'Unsupported';
                }
            } catch (err) {
                log(`[Groq API] Error: ${err.message}`, 'error');
                groqOutput.innerHTML = `<span style="color:#f85149;">Error: ${err.message}</span>`;
                groqStatus.textContent = 'Failed';
            }
        }

        // Video Polling Helper
        async function pollVideoJob(operationName, apiKey, outputElement, statusElement, providerName) {
            const pollUrl = `https://generativelanguage.googleapis.com/v1beta/${operationName}?key=${apiKey}`;
            
            let isDone = false;
            while (!isDone) {
                await new Promise(r => setTimeout(r, 5000));
                log(`[${providerName} API] Polling video render status...`, 'info');

                const res = await fetch(pollUrl);
                const data = await res.json();

                if (data.done) {
                    isDone = true;
                    if (data.response && data.response.generatedVideos) {
                        const videoUri = data.response.generatedVideos[0].videoUri;
                        outputElement.innerHTML = `
                            <video controls autoplay loop>
                                <source src="${videoUri}" type="video/mp4">
                            </video>`;
                        log(`[${providerName} API] Video rendering completed!`, 'success');
                        statusElement.textContent = 'Complete';
                    } else {
                        throw new Error("Video task finished without output URL.");
                    }
                }
            }
        }
    </script>
</body>
</html>
