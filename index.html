<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator Interface</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f0f6fc;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Toggle switch */
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #238636;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .mode-label {
            font-weight: 600;
            color: #f0f6fc;
        }

        /* Input Bar Layout */
        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        /* Green Submit Button */
        .btn-green {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-green:hover {
            background-color: #2ea043;
        }

        .btn-green:disabled {
            background-color: #23863680;
            cursor: not-allowed;
        }

        /* Side-by-Side Output Grid */
        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .output-grid {
                grid-template-columns: 1fr;
            }
        }

        .output-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .output-title {
            background-color: #21262d;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
        }

        .output-content {
            padding: 15px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1117;
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
        }

        .output-content p {
            margin: 0;
            text-align: left;
            color: #c9d1d9;
            white-space: pre-wrap;
            width: 100%;
        }

        video {
            width: 100%;
            max-height: 220px;
            border-radius: 6px;
            outline: none;
        }

        /* Debug Console Section */
        .debug-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .debug-header h2 {
            font-size: 1rem;
            margin: 0;
            color: #8b949e;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #58a6ff;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        #debug-log {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            white-space: pre-wrap;
        }

        .log-entry { margin-bottom: 4px; }
        .log-info { color: #58a6ff; }
        .log-success { color: #7ee787; }
        .log-error { color: #f85149; }
    </style>
</head>
<body>

    <h1>AI Request Dashboard</h1>

    <!-- Input Box & Mode Selection -->
    <div class="container">
        <div class="toggle-group">
            <span>Text Gen</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider"></span>
            </label>
            <span>Video Gen</span>
            <span class="mode-label" id="current-mode-label">(Current: Text Generation)</span>
        </div>

        <div class="input-group">
            <input type="text" id="prompt-input" placeholder="Enter your prompt here..." />
            <button class="btn-green" id="submit-btn" onclick="sendRequest()">Generate</button>
        </div>
    </div>

    <!-- Separate Display Boxes -->
    <div class="output-grid">
        <!-- Text Box -->
        <div class="output-box">
            <div class="output-title">Text Generation Output</div>
            <div class="output-content" id="text-output">
                <span>No text generated yet.</span>
            </div>
        </div>

        <!-- Video Box -->
        <div class="output-box">
            <div class="output-title">Video Generation Output</div>
            <div class="output-content" id="video-output">
                <span>No video generated yet.</span>
            </div>
        </div>
    </div>

    <!-- Debug Log Panel -->
    <div class="debug-container">
        <div class="debug-header">
            <h2>Debug Log</h2>
            <button class="clear-btn" onclick="clearLogs()">Clear</button>
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        const toggle = document.getElementById('mode-toggle');
        const modeLabel = document.getElementById('current-mode-label');
        const promptInput = document.getElementById('prompt-input');
        const debugLog = document.getElementById('debug-log');
        const submitBtn = document.getElementById('submit-btn');
        const textOutput = document.getElementById('text-output');
        const videoOutput = document.getElementById('video-output');

        log('Page loaded successfully. Ready for requests.', 'info');

        toggle.addEventListener('change', () => {
            const mode = toggle.checked ? 'Video Generation' : 'Text Generation';
            modeLabel.textContent = `(Current: ${mode})`;
            log(`Mode switched to: ${mode}`, 'info');
        });

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function clearLogs() {
            debugLog.innerHTML = '';
            log('Logs cleared.', 'info');
        }

        async function sendRequest() {
            const prompt = promptInput.value.trim();
            const mode = toggle.checked ? 'video' : 'text';

            if (!prompt) {
                log('Error: Prompt cannot be empty.', 'error');
                return;
            }

            submitBtn.disabled = true;
            log(`Initiating ${mode.toUpperCase()} request...`, 'info');
            log(`Prompt: "${prompt}"`, 'info');

            try {
                if (mode === 'text') {
                    log('Sending request to Text Generation API...', 'info');
                    textOutput.innerHTML = '<span>Generating text...</span>';
                    
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    textOutput.innerHTML = `<p>${prompt}\n\n[Sample generated text result from the API call goes here.]</p>`;
                    log('Response received: Text updated in Text Box.', 'success');
                } else {
                    log('Initiating Video Generation job...', 'info');
                    videoOutput.innerHTML = '<span>Rendering video...</span>';
                    
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    // Demo sample video output element
                    videoOutput.innerHTML = `
                        <video controls autoplay loop muted>
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                            Your browser does not support HTML video.
                        </video>`;
                    log('Response received: Video loaded in Video Box.', 'success');
                }
            } catch (err) {
                log(`Request failed: ${err.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
